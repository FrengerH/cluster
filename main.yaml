apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: main-app
spec:
  # Child Application CRs carry a /status written by the controller; without
  # this ignore the app-of-apps shows OutOfSync whenever a child keeps an
  # operation-state record (e.g. a Failed sync attempt).
  ignoreDifferences:
  - group: argoproj.io
    kind: Application
    jsonPointers:
    - /status
  syncPolicy:
    automated: {}
  destination:
    name: in-cluster
    namespace: argocd
  source:
    path: apps
    repoURL: 'https://github.com/FrengerH/cluster'
    targetRevision: HEAD
  project: default

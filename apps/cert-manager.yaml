# Adopted 2026-09: was a legacy in-cluster Helm release (v1.16.2, values
# carried over verbatim into apps/values/cert-manager). No plaintext secrets
# in values -> safe for avp passthrough rendering.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
spec:
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  destination:
    name: in-cluster
    namespace: cert-manager
  sources:
    - repoURL: 'https://github.com/frengerh/cluster'
      path: apps/values/cert-manager
      targetRevision: HEAD
      plugin: # we just use the plugin source, the plugin script will do the helm pull and template
        env: #set the variables needed
          - name: HELM_VALUES_FILES
            value: "values.yaml"
          - name: HELM_REPO_URL
            value: "https://charts.jetstack.io"
          - name: HELM_CHART_NAME
            value: "cert-manager"
          - name: HELM_CHART_VERSION
            value: "v1.21.1"
          - name: HELM_RELEASE_NAME
            value: "cert-manager"
  project: default

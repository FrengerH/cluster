apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: freshrss
spec:
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
  destination:
    name: in-cluster
    namespace: freshrss
  sources:
  - repoURL: 'https://github.com/FrengerH/cluster'
    targetRevision: HEAD
    path: apps/freshrss
  ignoreDifferences:
  # k3s adds status.terminatingReplicas and the controller writes /status
  - group: apps
    kind: Deployment
    jsonPointers:
    - /status
  project: default

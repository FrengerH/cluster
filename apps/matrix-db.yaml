apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: matrix-db
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  destination:
    name: in-cluster
    namespace: matrix
  sources:
  - repoURL: 'https://github.com/FrengerH/cluster'
    targetRevision: HEAD
    path: apps/matrix-db
  project: default

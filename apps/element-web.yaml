apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: element-web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/FrengerH/cluster
    targetRevision: main
    path: apps/element-web
  destination:
    server: https://kubernetes.default.svc
    namespace: matrix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

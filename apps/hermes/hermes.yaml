---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
spec:
  ports:
  - port: 8787
    targetPort: 8787
    protocol: TCP
  clusterIP: None
---
apiVersion: v1
kind: Endpoints
metadata:
  name: hermes
  namespace: hermes
subsets:
- addresses:
  - ip: 192.168.123.169
  ports:
  - port: 8787
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes
  namespace: hermes
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: <path:hermes-config#domain>
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hermes
            port:
              number: 8787
  tls:
  - hosts:
    - <path:hermes-config#domain>
    secretName: tls-hermes-ingress

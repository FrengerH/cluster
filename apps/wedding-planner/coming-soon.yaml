    Disallow: /icons
  sitemap.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
      <url>
        <loc>https://test.onsemarie.nl/</loc>
        <lastmod>2026-11-11</lastmod>
      </url>
    </urlset>
kind: ConfigMap
metadata:
  name: coming-soon-site
  namespace: wedding
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coming-soon
  namespace: wedding
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coming-soon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coming-soon
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx-default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: content
          configMap:
            name: coming-soon-site
            items:
              - {key: index.html, path: index.html}
              - {key: favicon.svg, path: favicon.svg}
              - {key: robots.txt, path: robots.txt}
              - {key: sitemap.xml, path: sitemap.xml}
              - {key: llms.txt, path: llms.txt}
        - name: conf
          configMap:
            name: coming-soon-site
            items:
              - {key: nginx-default.conf, path: nginx-default.conf}
---
apiVersion: v1
kind: Service
metadata:
  name: coming-soon
  namespace: wedding
spec:
  selector:
    app.kubernetes.io/name: coming-soon
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: coming-soon
  namespace: wedding
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`<path:wedding-planner-config#domain>`) && (Path(`/`) || Path(`/robots.txt`) || Path(`/sitemap.xml`) || Path(`/llms.txt`) || Path(`/favicon.svg`))
      kind: Rule
      # beats the app's PathPrefix(/) router, whose default priority is rule length
      priority: 1000
      services:
        - name: coming-soon
          port: 80
  tls:
    secretName: tls-onsemarie-wildcard

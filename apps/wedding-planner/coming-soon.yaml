    <style>
    :root {
      --bg: #faf7f2;
      --ink: #2e2723;
      --wine: #8e4460;
      --muted: #6b615a;
      --line: #e6ddd2;
    }
    * { box-sizing: border-box; margin: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Karla', system-ui, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 60% 40% at 12% 8%, rgba(142, 68, 96, .07), transparent 60%),
        radial-gradient(ellipse 50% 35% at 88% 92%, rgba(142, 68, 96, .05), transparent 60%);
      background-attachment: fixed;
      color: var(--ink);
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      line-height: 1.65;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9;
    }
    main {
      flex: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: clamp(48px, 9vh, 96px) 24px 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .eyebrow {
      font-size: 13px;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--wine);
      font-weight: 600;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-size: clamp(52px, 11vw, 96px);
      line-height: 1.05;
      margin: 18px 0 8px;
      letter-spacing: .01em;
    }
    .amp {
      font-style: italic;
      color: var(--wine);
      font-weight: 500;
      padding: 0 .08em;
    }
    .flourish { margin: 10px 0 18px; }
    .when {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 500;
    }
    .where {
      margin-top: 6px;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: .02em;
    }
    .count {
      display: flex;
      gap: clamp(10px, 4vw, 28px);
      margin: 36px 0 30px;
    }
    .cell {
      min-width: 64px;
      padding: 10px 6px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .cell .num {
      display: block;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(28px, 6vw, 40px);
      font-weight: 600;
      color: var(--wine);
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }
    .cell .lbl {
      display: block;
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }
    .now {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(24px, 5vw, 34px);
      font-style: italic;
      color: var(--wine);
    }
    .note { max-width: 46ch; color: var(--muted); font-size: 16px; }
    .faq {
      margin-top: 56px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
      text-align: left;
      width: 100%;
      max-width: 560px;
    }
    .faq h2 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 14px;
      text-align: center;
    }
    .faq h3 {
      font-size: 14px;
      letter-spacing: .04em;
      color: var(--wine);
      font-weight: 600;
      margin-top: 16px;
    }
    .faq p { color: var(--muted); font-size: 15px; margin-top: 2px; }
    footer {
      text-align: center;
      padding: 26px 24px 34px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .06em;
    }
    .reveal { opacity: 0; transform: translateY(14px); animation: fadeUp .7s ease forwards; }
    .d1 { animation-delay: .08s; }
    .d2 { animation-delay: .16s; }
    .d3 { animation-delay: .24s; }
    .d4 { animation-delay: .32s; }
    .d5 { animation-delay: .4s; }
    .d6 { animation-delay: .48s; }
    @keyframes fadeUp { to { opacity: 1; transform: none; } }
    :focus-visible { outline: 2px solid var(--wine); outline-offset: 3px; }
    @media (max-width: 420px) {
      .count { gap: 8px; }
      .cell { min-width: 58px; padding: 8px 2px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; opacity: 1; transform: none; }
    }
    </style>
    </head>
    <body>
    <main>
      <p class="eyebrow reveal">Wij gaan trouwen</p>
      <h1 class="reveal d1">Sue <span class="amp">&amp;</span> Ferry</h1>
      <div class="flourish reveal d2" aria-hidden="true">
        <svg width="120" height="16" viewBox="0 0 120 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 8 H44" stroke="#8e4460" stroke-width="1"/>
          <path d="M76 8 H120" stroke="#8e4460" stroke-width="1"/>
          <rect x="56" y="4" width="8" height="8" transform="rotate(45 60 8)" fill="#8e4460"/>
        </svg>
      </div>
      <p class="when reveal d2"><time datetime="2027-07-24">zaterdag 24 juli 2027</time></p>
      <p class="where reveal d3">La Colonie de Trézien · Plouarzel · Bretagne, Frankrijk</p>

      <div class="count reveal d4" role="timer" aria-label="Tijd tot 24 juli 2027">
        <div class="cell"><span class="num" id="cd-d">254</span><span class="lbl">dagen</span></div>
        <div class="cell"><span class="num" id="cd-h">15</span><span class="lbl">uur</span></div>
        <div class="cell"><span class="num" id="cd-m">00</span><span class="lbl">min</span></div>
        <div class="cell"><span class="num" id="cd-s">00</span><span class="lbl">sec</span></div>
      </div>

      <p class="note reveal d5">De trouwsite is in de maak. Binnenkort staat hier het programma, praktische informatie voor gasten en alles over het trouwweekend aan de Bretonse kust.</p>

      <section class="faq reveal d6" aria-labelledby="faq-t">
        <h2 id="faq-t">Veelgestelde vragen</h2>
        <h3>Wanneer trouwen Sue en Ferry?</h3>
        <p>Op zaterdag 24 juli 2027.</p>
        <h3>Waar vindt de bruiloft plaats?</h3>
        <p>In La Colonie de Trézien aan de kust van Bretagne, Frankrijk: 1400 route du Cross Corsen, 29810 Plouarzel.</p>
        <h3>Wanneer gaat de trouwsite online?</h3>
        <p>De site is nu in de maak. Binnenkort staat hier het programma, praktische informatie en alles over het trouwweekend.</p>
      </section>
    </main>
    <footer class="reveal d6">© 2027 Sue &amp; Ferry</footer>
    <script>
    (function () {
      var target = new Date('2027-07-24T00:00:00+02:00').getTime();
      var els = {
        d: document.getElementById('cd-d'),
        h: document.getElementById('cd-h'),
        m: document.getElementById('cd-m'),
        s: document.getElementById('cd-s')
      };
      var timer;
      function tick() {
        var diff = target - Date.now();
        if (diff <= 0) {
          if (timer) clearInterval(timer);
          var box = document.querySelector('.count');
          if (box) box.innerHTML = '<p class="now">Vandaag is het zover!</p>';
          return;
        }
        var t = Math.floor(diff / 1000);
        els.d.textContent = Math.floor(t / 86400);
        els.h.textContent = Math.floor(t % 86400 / 3600);
        els.m.textContent = String(Math.floor(t % 3600 / 60)).padStart(2, '0');
        els.s.textContent = String(t % 60).padStart(2, '0');
      }
      tick();
      timer = setInterval(tick, 1000);
    })();
    </script>
    </body>
    </html>
  llms.txt: |
    # Sue & Ferry wedding site

    > Official wedding site (Dutch) for the wedding of Sue and Ferry on Saturday 24 July 2027 in Plouarzel, Brittany, France. The full site is still under construction; this coming-soon page is the current landing page.

    - Wedding date: Saturday 24 July 2027
    - Venue: La Colonie de Trézien, 1400 route du Cross Corsen, 29810 Plouarzel, Brittany, France
    - Site languages: Dutch, French, English
    - Status: under construction, launch details follow on this page
    - The planner and RSVP areas are invitation-only and closed to all crawlers
  nginx-default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # no-cache: browsers heuristic-cache statics for hours without it, so
        # page updates stay invisible until the cache expires (admin SPA lesson)
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            try_files $uri $uri/ =404;
        }
    }
  robots.txt: |
    # onsemarie.nl: the public coming-soon landing page is indexable; every
    # wedding-planner app surface stays private. RSVP invite tokens in URLs are
    # effectively passwords, so those paths must never be crawled by anyone.

    User-agent: *
    Allow: /
    Disallow: /planner
    Disallow: /admin
    Disallow: /api
    Disallow: /rsvp
    Disallow: /storage
    Disallow: /build
    Disallow: /vendor
    Disallow: /index.php
    Disallow: /manifest
    Disallow: /sw.js
    Disallow: /icons

    # AI training crawlers: nothing at all, not even the landing page
    User-agent: GPTBot
    User-agent: Google-Extended
    User-agent: Applebot-Extended
    User-agent: CCBot
    User-agent: Bytespider
    User-agent: anthropic-ai
    User-agent: ClaudeBot
    User-agent: Amazonbot
    User-agent: FacebookBot
    User-agent: meta-externalagent
    User-agent: ImagesiftBot
    User-agent: Diffbot
    User-agent: MistralAI-User
    User-agent: PanguBot
    User-agent: Timpibot
    Disallow: /

    # AI answer/search engines: public landing page only, app surfaces stay closed
    User-agent: OAI-SearchBot
    User-agent: ChatGPT-User
    User-agent: Claude-SearchBot
    User-agent: Claude-User
    User-agent: PerplexityBot
    User-agent: Perplexity-User
    User-agent: YouBot
    Allow: /
    Disallow: /planner
    Disallow: /admin
    Disallow: /api
    Disallow: /rsvp
    Disallow: /storage
    Disallow: /build
    Disallow: /vendor
    Disallow: /index.php
    Disallow: /manifest

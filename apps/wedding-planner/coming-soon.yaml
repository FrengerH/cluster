    <style>
    :root {
      --bg: #faf7f2;
      --ink: #2e2723;
      --wine: #8e4460;
      --wine-soft: rgba(142, 68, 96, .1);
      --muted: #6b615a;
      --line: #e6ddd2;
      --ok: #4c7a5e;
    }
    * { box-sizing: border-box; margin: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Karla', system-ui, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 60% 40% at 12% 8%, rgba(142, 68, 96, .07), transparent 60%),
        radial-gradient(ellipse 50% 35% at 88% 92%, rgba(142, 68, 96, .05), transparent 60%);
      background-attachment: fixed;
      color: var(--ink);
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      line-height: 1.65;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9;
    }
    a { color: var(--wine); }
    main {
      flex: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: clamp(48px, 8vh, 88px) 24px 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .eyebrow {
      font-size: 13px;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--wine);
      font-weight: 600;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-size: clamp(44px, 9vw, 76px);
      line-height: 1.08;
      margin: 16px 0 10px;
    }
    .tagline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: clamp(20px, 3.4vw, 26px);
      color: var(--wine);
      font-weight: 500;
      max-width: 34ch;
    }
    .lede {
      margin-top: 20px;
      max-width: 54ch;
      color: var(--muted);
      font-size: 17px;
    }
    section { width: 100%; }
    h2 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(24px, 4vw, 30px);
      font-weight: 600;
    }
    .features {
      margin-top: 56px;
      padding-top: 40px;
      border-top: 1px solid var(--line);
    }
    .features h2 { margin-bottom: 28px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      text-align: left;
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 20px;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(46,39,35,.08); }
    .card .ico {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--wine-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .card h3 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .card p { color: var(--muted); font-size: 14.5px; line-height: 1.55; }
    .faq {
      margin-top: 56px;
      padding-top: 32px;
      border-top: 1px solid var(--line);
      text-align: left;
      width: 100%;
      max-width: 560px;
    }
    .faq h2 { text-align: center; margin-bottom: 14px; }
    .faq h3 {
      font-size: 14px;
      letter-spacing: .04em;
      color: var(--wine);
      font-weight: 700;
      margin-top: 16px;
    }
    .faq p { color: var(--muted); font-size: 15px; margin-top: 2px; }
    footer {
      text-align: center;
      padding: 26px 24px 34px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .06em;
    }
    .reveal { opacity: 0; transform: translateY(14px); animation: fadeUp .7s ease forwards; }
    .d1 { animation-delay: .08s; } .d2 { animation-delay: .16s; } .d3 { animation-delay: .24s; }
    .d4 { animation-delay: .32s; } .d5 { animation-delay: .4s; } .d6 { animation-delay: .48s; }
    @keyframes fadeUp { to { opacity: 1; transform: none; } }
    :focus-visible { outline: 2px solid var(--wine); outline-offset: 3px; }
    @media (max-width: 680px) {
      .cards { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; opacity: 1; transform: none; }
    }
    </style>
    </head>
    <body>
    <main>
      <p class="eyebrow reveal">Binnenkort beschikbaar</p>
      <h1 class="reveal d1">On se marie</h1>
      <p class="tagline reveal d1">Plan je bruiloft</p>
      <p class="lede reveal d2">On se marie wordt een platform waarmee je zelf je bruiloft plant: gastenlijst en RSVP's per gezin, een zitplan, een gedeeld moodboard en een takenlijst die je met je partner deelt.</p>

      <section class="features reveal d3" aria-labelledby="features-t">
        <h2 id="features-t">Wat je straks kunt doen</h2>
        <div class="cards">
          <article class="card">
            <div class="ico" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2 19c0-2.8 2.7-5 6-5s6 2.2 6 5M14 19c0-2.2 1.8-4 4-4s4 1.8 4 4" stroke="#8e4460" stroke-width="1.6" stroke-linecap="round"/></svg>
            </div>
            <h3>Gastenlijst en RSVP's</h3>
            <p>Nodig gasten uit per gezin, houd RSVP's en dieetwensen bij en zie direct wie er komt.</p>
          </article>
          <article class="card">
            <div class="ico" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="#8e4460" stroke-width="1.6"/><path d="M3 9h18M9 21V9" stroke="#8e4460" stroke-width="1.6"/></svg>
            </div>
            <h3>Zitplan en takenlijst</h3>
            <p>Stel de tafelindeling samen en deel een takenlijst met je partner, zodat niemand het overzicht verliest.</p>
          </article>
          <article class="card">
            <div class="ico" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.6-9.6-8.8C.8 9 2 5.5 5.3 4.8 7.6 4.3 9.8 5.4 12 8c2.2-2.6 4.4-3.7 6.7-3.2 3.3.7 4.5 4.2 2.9 7.4C19 16.4 12 21 12 21Z" stroke="#8e4460" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </div>
            <h3>Moodboard en foto's</h3>
            <p>Verzamel inspiratie op een gedeeld moodboard en laat gasten hun eigen foto's van de dag delen.</p>
          </article>
        </div>
      </section>

      <section class="faq reveal d4" aria-labelledby="faq-t">
        <h2 id="faq-t">Veelgestelde vragen</h2>
        <h3>Wat is On se marie?</h3>
        <p>On se marie wordt een platform waarmee je je eigen bruiloft plant: gastenlijst en RSVP's per gezin, een zitplan, een gedeeld moodboard en een takenlijst, allemaal op één plek.</p>
        <h3>Wanneer gaat On se marie live?</h3>
        <p>We zijn in de laatste fase vóór lancering. Kom later terug om te zien wanneer je een eigen account kunt aanmaken.</p>
        <h3>Kan ik nu al een account aanmaken?</h3>
        <p>Nog niet. Zodra het platform open gaat, kun je zelf een account aanmaken en beginnen met plannen.</p>
        <h3>Is mijn informatie privé?</h3>
        <p>Ja. Je gastenlijst, foto's en planning zijn alleen zichtbaar voor jou en de mensen die jij uitnodigt.</p>
      </section>
    </main>
    <footer class="reveal d5">© 2026 On se marie</footer>
    </body>
    </html>
  llms.txt: |
    # On se marie

    > On se marie is a wedding planning platform currently in pre-launch development. Couples will be able to create their own account and plan their wedding: guest list and household-based RSVPs, a seating plan, a shared moodboard, and a shared task checklist. Dutch-language product, built in the Netherlands.

    - Status: pre-launch, building in public
    - Already built: guest list and RSVP management per household, seating planner, shared moodboard with guest photo sharing, shared task checklist, trilingual (nl/fr/en) guest-facing pages
    - Not yet available: public self-service account creation, multi-tenant sign-up, pricing
    - Updates: join the email list on the homepage at https://test.onsemarie.nl/
  nginx-default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # no-cache: browsers heuristic-cache statics for hours without it, so
        # page updates stay invisible until the cache expires (admin SPA lesson)
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            try_files $uri $uri/ =404;
        }
    }
  robots.txt: |
    # On se marie: public pre-launch landing page, open for indexing and AI
    # discovery. The private wedding-planning app underneath (planner/admin/
    # rsvp/api) is a separate, invitation-only surface and stays closed to
    # every crawler -- invite tokens in those URLs are effectively passwords.

    User-agent: *
    Allow: /
    Disallow: /planner
    Disallow: /admin
    Disallow: /api
    Disallow: /rsvp
    Disallow: /storage
    Disallow: /build
    Disallow: /vendor
    Disallow: /index.php
    Disallow: /manifest
    Disallow: /sw.js
    Disallow: /icons

    Sitemap: https://test.onsemarie.nl/sitemap.xml
  sitemap.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
      <url>
        <loc>https://test.onsemarie.nl/</loc>
        <lastmod>2026-11-11</lastmod>
        <changefreq>weekly</changefreq>
      </url>
    </urlset>
kind: ConfigMap
metadata:
  name: coming-soon-site
  namespace: wedding
---
---
---
---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coming-soon
  namespace: wedding
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coming-soon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coming-soon
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.8-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx-default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: content
          configMap:
            name: coming-soon-site
            items:
              - {key: index.html, path: index.html}
              - {key: favicon.svg, path: favicon.svg}
              - {key: robots.txt, path: robots.txt}
              - {key: sitemap.xml, path: sitemap.xml}
              - {key: llms.txt, path: llms.txt}
        - name: conf
          configMap:
            name: coming-soon-site
            items:
              - {key: nginx-default.conf, path: nginx-default.conf}
---
apiVersion: v1
kind: Service
metadata:
  name: coming-soon
  namespace: wedding
spec:
  selector:
    app.kubernetes.io/name: coming-soon
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: coming-soon
  namespace: wedding
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`<path:wedding-planner-config#domain>`) && (Path(`/`) || Path(`/robots.txt`) || Path(`/sitemap.xml`) || Path(`/llms.txt`) || Path(`/favicon.svg`))
      kind: Rule
      # beats the app's PathPrefix(/) router, whose default priority is rule length
      priority: 1000
      services:
        - name: coming-soon
          port: 80
  tls:
    secretName: tls-onsemarie-wildcard

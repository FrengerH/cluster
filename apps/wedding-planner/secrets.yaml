# Namespace-scoped secrets (unseal directly in `wedding`, not via the
# argocd-ns avp <path:...> pattern used for domain names).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: gitea-regcred
  namespace: wedding
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: gitea-regcred
      namespace: wedding
    type: kubernetes.io/dockerconfigjson
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wedding-planner-secrets
  namespace: wedding
spec:
  encryptedData:
    app_key: 
    db_password: 

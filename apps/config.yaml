apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config
spec:
  ignoreDifferences:
  # sealed-secrets controller writes .status on every unseal/generation bump;
  # without this the app shows OutOfSync forever after any key rotation.
  - group: bitnami.com
    kind: SealedSecret
    jsonPointers:
    - /status
  destination:
    name: in-cluster
    namespace: argocd
  sources:
  - repoURL: 'https://github.com/FrengerH/cluster'
    targetRevision: HEAD
    path: apps/config
  project: default

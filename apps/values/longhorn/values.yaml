# Longhorn storage (adopted from a pre-GitOps kubectl install).
# Version is pinned in apps/longhorn.yaml; upgrades move one minor at a time.
#
# Secrets (backup target) come from the sealed longhorn-config secret via
# avp placeholders; see apps/config/config.yaml.

defaultSettings:
  # backup-target is managed by the longhorn-backup-target overlay app
  # (whole-value avp placeholder from the sealed longhorn-config secret).
  priorityClass: longhorn-critical
  # Revision counter stays ENABLED: it lets Longhorn identify the freshest
  # replica so auto-salvage after a node crash cannot promote a stale/corrupt
  # replica. Disabling it caused silent data loss when a node restarted mid-op.
  disableRevisionCounter: false

persistence:
  defaultClass: true
  defaultClassReplicaCount: 3
  storageClassName: longhorn
  recurringJobSelector:
    enable: true
    # Chart 1.13 templates jobList with Go fmt instead of toJson, so it must
    # be a pre-formatted JSON string; a YAML list renders as `[map[...]]`
    # and every new PVC fails with "invalid json format of recurringJobSelector".
    jobList: '[{"name":"default","isGroup":true}]'

csi:
  attacherReplicaCount: 1
  provisionerReplicaCount: 1
  resizerReplicaCount: 1
  snapshotterReplicaCount: 1

longhornUI:
  replicas: 1

# Longhorn storage (adopted from a pre-GitOps kubectl install).
# Version is pinned in apps/longhorn.yaml; upgrades move one minor at a time.
#
# Secrets (backup target) come from the sealed longhorn-config secret via
# avp placeholders; see apps/config/config.yaml.

defaultSettings:
  # backup-target is managed by the longhorn-backup-target overlay app
  # (whole-value avp placeholder from the sealed longhorn-config secret).
  priorityClass: longhorn-critical
  disableRevisionCounter: true

persistence:
  defaultClass: true
  defaultClassReplicaCount: 3
  storageClassName: longhorn
  recurringJobSelector:
    enableSystem: true

csi:
  attacherReplicaCount: 1
  provisionerReplicaCount: 1
  resizerReplicaCount: 1
  snapshotterReplicaCount: 1

longhornUI:
  replicas: 1

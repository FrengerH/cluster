global:
  domain: <path:argocd-config#domain>
  image:
    repository: quay.io/argoproj/argocd
    tag: "v3.5.2"
    imagePullPolicy: IfNotPresent
server:
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    labels: {}
    ingressClassName: "traefik"

    # Chart >= 9 ingress schema: single hostname (falls back to global.domain),
    # tls as bool with a hardcoded secret name. extraTls keeps our existing
    # cert-manager-managed secret so the cert is not re-issued.
    hostname: <path:argocd-config#domain>
    pathType: Prefix
    tls: false
    extraTls:
      - hosts:
          - <path:argocd-config#domain>
        secretName: tls-argocd-ingress


repoServer:
  replicas: 1
  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  livenessProbe:
    timeoutSeconds: 5
    periodSeconds: 10
  readinessProbe:
    timeoutSeconds: 5
    periodSeconds: 10
  volumes:
  # Mount the avp volume
    - configMap:
        name: avp-plugin
      name: avp-plugin
    - name: custom-tools
      emptyDir: { }
  initContainers:
    - name: download-tools
      # busybox (not ubi8): ubi8:latest is pull-always and registry.access.redhat.com
      # is unreachable from the node's IPv6 path (TLS-intercepted wrong cert).
      image: public.ecr.aws/docker/library/busybox:1.36
      env:
        - name: AVP_VERSION
          value: 1.18.1
      command: [ sh, -c ]
      # download avp
      args:
        - >-
          wget -O argocd-vault-plugin https://github.com/argoproj-labs/argocd-vault-plugin/releases/download/v$(AVP_VERSION)/argocd-vault-plugin_$(AVP_VERSION)_linux_arm64 &&
          chmod +x argocd-vault-plugin &&
          mv argocd-vault-plugin /custom-tools/
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  extraContainers:
  # creates a single argocd vault plugin for kustomize, raw yaml and helm
    - name: arocd-vault-plugin
      command: [ /var/run/argocd/argocd-cmp-server ]
      image: quay.io/argoproj/argocd:v3.5.2
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      volumeMounts:
        - mountPath: /var/run/argocd
          name: var-files
        - mountPath: /home/argocd/cmp-server/plugins
          name: plugins
        - mountPath: /tmp
          name: tmp
        # Register plugins into sidecar
        - mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: avp.yaml
          name: avp-plugin
        - mountPath: /home/argocd/cmp-server/avp-check.sh
          subPath: avp-check.sh
          name: avp-plugin
        - mountPath: /home/argocd/cmp-server/avp-generate.sh
          subPath: avp-generate.sh
          name: avp-plugin

        # Important: Mount tools into $PATH
        - name: custom-tools
          subPath: argocd-vault-plugin
          mountPath: /usr/local/bin/argocd-vault-plugin

# MetalLB L2 pool + advertisement. The address range is a secret: it lives in
# the sealed metallb-config secret (apps/config/config.yaml) and is resolved
# by avp at render time. Sealed; see apps/config/config.yaml.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: first-pool
  namespace: metallb-system
spec:
  addresses:
    - <path:metallb-config#pool>
  autoAssign: true
  avoidBuggyIPs: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - first-pool

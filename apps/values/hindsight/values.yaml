# Hindsight (vectorize.io) — persistent memory backend for Hermes agents.
# Deployed from the official OCI chart via the avp helm-pull plugin.
#
# Secrets: the <path:hindsight-config#KEY> placeholders are resolved by
# argocd-vault-plugin at render time from the `hindsight-config` secret
# (namespace argocd — unsealed there from the SealedSecret in
# apps/config/config.yaml). Same pattern as searxng-config.
#
# Layout: api + control-plane + bundled pgvector PostgreSQL.

nameOverride: hindsight

api:
  env:
    HINDSIGHT_API_LLM_PROVIDER: "openai"
    # z.ai coding endpoint (OpenAI-compatible). Key comes from the sealed
    # secret below. glm-4.6 over glm-4.7-flash: the coding endpoint throws
    # transient 429 "overloaded" at flash far more often (2/3 failures in
    # testing vs 0/3 for 4.6), and a 429 during Hindsight's startup LLM
    # verification aborts boot. Extraction volume is tiny, so the higher
    # per-token price of 4.6 is negligible.
    HINDSIGHT_API_LLM_MODEL: "glm-4.6"
    HINDSIGHT_API_LLM_BASE_URL: "https://api.z.ai/api/coding/paas/v4"
  # Reranker + embedding models download on first boot (~1-2 GB). Keep them
  # on a PVC so pod restarts don't re-download (longhorn, default class).
  persistence:
    modelCache:
      enabled: true
      size: 5Gi
  # Pinned via TOP-LEVEL nodeSelector below: cl-node4 is the ONLY armv8.2
  # node (nodes 1-3 are Pi 4 / BCM2835, armv8.0) — the API image's ML libs
  # use fp16/dotprod instructions and SIGILL on the older boards (exit 132,
  # 2026-09-04). Guards on node4: journald capped 200M, logrotate maxsize,
  # longhorn replicas kept off it. NOTE: the chart reads only the top-level
  # nodeSelector (per-component values are ignored), so all components land
  # on cl-node4.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 3Gi
  secrets:
    HINDSIGHT_API_LLM_API_KEY: <path:hindsight-config#llm_api_key>

controlPlane:
  env:
    NODE_ENV: "production"
    HINDSIGHT_CP_HOSTNAME: "0.0.0.0"
    HINDSIGHT_CP_PORT: "3000"
  # Login key for the web UI (native control-plane auth — no browser, no
  # memory). Value resolved by avp from the same sealed secret.
  secrets:
    HINDSIGHT_CP_ACCESS_KEY: <path:hindsight-config#cp_access_key>
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

postgresql:
  auth:
    username: hindsight
    password: <path:hindsight-config#pg_password>
    database: hindsight
  persistence:
    enabled: true
    size: 8Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Two public endpoints via the cluster Traefik, TLS via
# cert-manager letsencrypt-prod. DNS: hindsight(.ui).hmdev.nl -> Traefik VIP (Pi-hole).
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: hindsight.hmdev.nl
      paths:
        - path: /
          pathType: Prefix
          service: api
    - host: hindsight-ui.hmdev.nl
      paths:
        - path: /
          pathType: Prefix
          service: controlPlane
  tls:
    - secretName: tls-hindsight-ingress
      hosts:
        - hindsight.hmdev.nl
    - secretName: tls-hindsight-ui-ingress
      hosts:
        - hindsight-ui.hmdev.nl

# TOP-LEVEL pin (the only nodeSelector the chart actually reads): cl-node4
# is the ONLY armv8.2 node — nodes 1-3 are Pi 4 / BCM2835 (armv8.0) and the
# hindsight-api ML stack SIGILLs there (exit 132, 2026-09-04). All
# components therefore land on cl-node4 (32GB RAM, disk guarded).
nodeSelector:
  kubernetes.io/hostname: cl-node4

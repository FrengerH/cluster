# Immich - Self-hosted photo management
# Chart: oci://ghcr.io/immich-app/immich-charts/immich 0.13.2
# Deployed via avp helm-pull plugin.
#
# DB: separate StatefulSet (apps/immich-db/) using Immich's official
# postgres image with vectorchord extension.
# Library: NFS PVC from apps/immich-volume/ (photos share on NAS).

# Shared across all Immich components (bjw-s common library merges
# top-level controller keys into every component).
controllers:
  main:
    pod:
      nodeSelector:
        kubernetes.io/hostname: cl-node4
    containers:
      main:
        image:
          tag: v3.2.0
        env:
          REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
          DB_HOSTNAME: immich-postgres
          DB_USERNAME: immich
          DB_DATABASE_NAME: immich
          DB_PASSWORD: <path:immich-config#db_password>
          # Server leaks memory rapidly when it keeps calling a missing ML
          # service (immich-app/immich#27617); must match machine-learning.enabled.
          IMMICH_MACHINE_LEARNING_ENABLED: "false"

immich:
  persistence:
    library:
      existingClaim: photos-pvc

# Valkey (Redis fork) for job queues
valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/valkey/valkey
            tag: 9.1-alpine
            pullPolicy: IfNotPresent
  persistence:
    data:
      enabled: true
      type: emptyDir

# Immich Server
server:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            pullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          # Default probes (1s timeout, period 10s, fail 3) are too aggressive
          # for video processing on ARM/NFS; a busy transcode or fsync can
          # block the event loop long enough to flap liveness.
          probes:
            liveness:
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: http
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 6
            readiness:
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: http
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 6
            startup:
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: http
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 30
  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
        - host: <path:immich-config#domain>
          paths:
            - path: /
              service:
                identifier: main
      tls:
        - secretName: tls-immich-ingress
          hosts:
            - <path:immich-config#domain>

# Machine Learning disabled — can be enabled later for face recognition,
# smart search, and auto-tagging.
machine-learning:
  enabled: false

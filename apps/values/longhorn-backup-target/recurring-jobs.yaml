# Recurring backup/snapshot jobs, GitOps-managed (previously created by hand).
#
# Two tiers:
#   default group  - all labeled volumes: nightly NAS backup + daily snapshot
#   critical group - databases (hindsight-pg, couchdb, home-assistant): frequent
#                    snapshots (cheap local recovery points) + 6-hourly NAS
#                    backups, so an incident like an auto-salvage on a node
#                    restart loses at most a few hours, not a full day.
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backups
  namespace: longhorn-system
spec:
  cron: "30 3 * * *"
  task: backup
  groups: ["default"]
  retain: 7
  concurrency: 2
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshots
  namespace: longhorn-system
spec:
  cron: "0 0 * * *"
  task: snapshot
  groups: ["default"]
  retain: 3
  concurrency: 2
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: critical-snapshots
  namespace: longhorn-system
spec:
  cron: "0 */4 * * *"
  task: snapshot
  groups: ["critical"]
  retain: 6
  concurrency: 2
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: critical-backups
  namespace: longhorn-system
spec:
  cron: "15 */6 * * *"
  task: backup
  groups: ["critical"]
  retain: 8
  concurrency: 2
